name: Bug report
description: 崩溃、报错、数据不对、UI 明显错位
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量附上日志和截图；能稳定复现的步骤最有帮助。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App 版本
      placeholder: v0.1.3 / 从 Releases 下载
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: opencode 版本
      placeholder: 2.2.5（GET /api/info 的 version）
  - type: input
    id: device
    attributes:
      label: 手机 / 系统
      placeholder: 例如 PKB110 / Android 17
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: logcat、错误弹窗、界面截图都可以直接贴进来
