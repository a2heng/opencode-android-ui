# 发版：推 tag `vX.Y.Z` 触发（版本号只用语义化版本，不用日期序号）。
# 手动 workflow_dispatch 只构建签名 APK，不创建 Release。
# 签名凭据来自仓库 Secrets：OM_KEYSTORE_BASE64 / OM_KEY_ALIAS / OM_KEY_PASS。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag 必须是 vX.Y.Z（当前：${GITHUB_REF_NAME}）" >&2
            exit 1
          fi
          CODE=$(printf '%s' "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.OM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "缺少 Secrets.OM_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release
        env:
          OM_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          OM_KEY_ALIAS: ${{ secrets.OM_KEY_ALIAS }}
          OM_KEY_PASS: ${{ secrets.OM_KEY_PASS }}
          OM_REQUIRE_SIGNING: "1"
        run: |
          ./gradlew assembleRelease --console=plain --stacktrace \
            -PomVersionName="${{ steps.version.outputs.name }}" \
            -PomVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Rename and checksum
        run: |
          mkdir -p out
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="opencode-mobile-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "out/$NAME"
          (cd out && sha256sum "$NAME" > "$NAME.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-mobile-${{ steps.version.outputs.name }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "OpenCode Mobile $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
